[project]
name = "tensa-backend"
version = "0.1.0"
description = "Project Tensa — Real-Time Voice Cloning Detection Engine"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # ML / AI
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=4.46.0",
    "onnxruntime-gpu>=1.20.0",
    "accelerate>=1.0.0",

    # Audio processing
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=2.1.0",
    "scipy>=1.14.0",

    # DSP
    "praat-parselmouth>=0.4.3",

    # Async concurrency
    "anyio>=4.6.0",
    "httpx>=0.27.0",

    # Utilities
    "rich>=13.9.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
